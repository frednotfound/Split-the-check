<style>
/* Hallmark · shape: app screen · genre: editorial · theme: Editorial (deal 3/3, seed split-bill-app-friends-group-ae11·b48dde35·2026-11-27·r0) · redesign: full
 * nav: kept shell (sticky ledger title, bottom tabs, add button) · signature: the ledger total set in the condensed head on the ink band · states: empty, missing rate, read-only share, sync
 * axes: light/display-condensed/chromatic-green · posture: restrained · modes: light+dark · contrast: pass
 * finish-review: subagent · 8 findings · 7 resolved 1 partial (sync chip needs a live Firebase room to capture) · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H5 E4 S4 R5 V4 · weakest: E, Chinese heads fall back to PingFang and Noto Serif TC since the theme faces are Latin, so the condensed face is kept for figures and Latin, where the ledger's numbers carry it */
/* Hallmark · waive 16 · save closes the bottom sheet over a list that can be longer than the screen · in a long ledger the new expense row lands below the fold, so the toast is the phone's only proof the expense was recorded */
/* Hallmark · answered F4 · the ink block is the one primary per screen; the filled chip, segment and member toggle are selection states, the green fill is the LINE share beside an outlined copy, and the brick fill only confirms a delete inside its own dialog */
:root{
  color-scheme:light;
  --space-3xs:2px; --space-2xs:4px; --space-xs:8px; --space-sm:12px; --space-md:16px; --space-lg:24px; --space-xl:40px; --space-2xl:64px; --space-3xl:96px; --space-4xl:144px;
  --text-xs:.75rem; --text-sm:.875rem; --text-md:1rem; --text-lg:1.2rem; --text-xl:1.44rem; --text-2xl:1.728rem; --text-3xl:2.074rem; --text-figure:3rem;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.7,0,.84,0);
  --dur-micro:120ms; --dur-short:220ms;
  --z-raised:10; --z-sticky:200; --z-sticky-nav:300; --z-modal:400; --z-toast:500;
  --color-paper:oklch(97% .007 86); --color-paper-2:oklch(94% .010 86); --color-paper-3:oklch(91% .012 84);
  --color-ink:oklch(16% .012 280); --color-ink-2:oklch(29% .011 280); --color-muted:oklch(48% .010 75);
  --color-rule:oklch(85% .009 85); --color-rule-2:oklch(64% .010 80);
  --color-accent:oklch(49% .130 152); --color-accent-ink:oklch(98% .005 88); --color-focus:oklch(52% .135 152);
  --color-band:var(--color-ink); --color-band-ink:var(--color-paper); --color-band-muted:oklch(80% .008 86); --color-band-rule:oklch(36% .012 280); --color-band-pos:oklch(82% .13 152);
  --color-warn:oklch(50% .11 68); --color-neg:oklch(50% .16 32);
  --tint-1:oklch(90% .035 30); --tint-2:oklch(90% .035 85); --tint-3:oklch(90% .035 150); --tint-4:oklch(90% .035 210); --tint-5:oklch(90% .035 265); --tint-6:oklch(90% .035 330);
  --scrim:oklch(16% .012 280 / .45); --scrim-soft:oklch(16% .012 280 / .18);
  --font-display:"Bricolage Grotesque","PingFang TC","Noto Sans TC","Microsoft JhengHei",ui-sans-serif,sans-serif;
  --font-body:"Source Serif 4","Noto Serif TC","Songti TC",ui-serif,Georgia,serif;
  --rule-hair:1px; --rule-heavy:4px;
  --u:1;
  --color-line-strong:var(--color-ink); --color-solid:var(--color-ink); --color-solid-ink:var(--color-paper);
  --tracking-display:-.012em; --display-weight:800;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    /* 深色模式：背景不用純黑、文字不用純白，粗線與填色按鈕再降一階，減少刺眼的黑白對比 */
    --color-paper:oklch(22% .011 80); --color-paper-2:oklch(25.5% .012 80); --color-paper-3:oklch(29% .013 80);
    --color-ink:oklch(87% .012 84); --color-ink-2:oklch(80% .011 84); --color-muted:oklch(67% .011 80);
    --color-rule:oklch(34% .011 82); --color-rule-2:oklch(48% .011 80);
    --color-line-strong:oklch(60% .012 82);
    --color-solid:oklch(79% .014 84); --color-solid-ink:oklch(21% .011 80);
    --color-accent:oklch(70% .095 152); --color-accent-ink:oklch(21% .011 80); --color-focus:oklch(72% .10 152);
    --color-band:oklch(29% .014 80); --color-band-ink:oklch(88% .012 84); --color-band-muted:oklch(72% .011 80); --color-band-rule:oklch(40% .012 82); --color-band-pos:oklch(77% .10 152);
    --color-warn:oklch(77% .095 75); --color-neg:oklch(71% .115 32);
    --tint-1:oklch(35% .04 30); --tint-2:oklch(35% .04 85); --tint-3:oklch(35% .04 150); --tint-4:oklch(35% .04 210); --tint-5:oklch(35% .04 265); --tint-6:oklch(35% .04 330);
    --scrim:oklch(10% .01 80 / .55); --scrim-soft:oklch(10% .01 80 / .28);
  }
}

/* base */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scrollbar-color:var(--color-rule-2) var(--color-paper)}
body{margin:0;background:var(--color-paper);color:var(--color-ink-2);font-family:var(--font-body);font-size:var(--text-md);line-height:1.55;font-optical-sizing:auto;caret-color:var(--color-accent);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--space-4xl) + env(safe-area-inset-bottom));min-height:100dvh}
body.locked{overflow:clip}
::selection{background:color-mix(in oklab,var(--color-accent) 22%,transparent);color:var(--color-ink)}
:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:var(--text-md)} /* 16px 以上，iOS 點擊輸入框才不會自動放大 */
button{cursor:pointer;touch-action:manipulation;border-radius:0}
button:disabled{cursor:not-allowed;opacity:.55}
a{color:inherit;text-decoration-thickness:1px;text-decoration-color:var(--color-rule-2);text-underline-offset:.2em}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:var(--display-weight);font-variation-settings:"wdth" 75,"opsz" 96;letter-spacing:var(--tracking-display);line-height:1.05;color:var(--color-ink);font-synthesis:none;overflow-wrap:break-word;min-width:0;text-wrap:balance;font-variant-numeric:lining-nums tabular-nums}
h2{font-size:var(--text-xl)}
h3{font-size:var(--text-lg);line-height:1.15}
p{margin:0;text-wrap:pretty}
svg{display:block}
[hidden]{display:none!important}
.num{font-variant-numeric:lining-nums tabular-nums}
.muted{color:var(--color-muted)}
.pos{color:var(--color-accent)} .neg{color:var(--color-ink)}
.ico{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}
.hint{font-size:var(--text-sm);color:var(--color-muted);line-height:1.5;margin-top:var(--space-xs);max-width:60ch}
.inline-link{color:var(--color-ink);text-decoration:underline;text-decoration-color:var(--color-rule-2)}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--space-md) var(--space-lg)}

/* the label face: controls, labels, meta, tags */
.btn,.chip-btn,.seg button,#tabs button,#fab,.tag,.sync,.field>span,.calc-grid label span,.day,.me,.link-btn,.icon-btn,.split-tools,.shared-per,.splitin>span,
.exp-sub,.lrow small,.drop-title,.done-tag,.chg-tag,.bal-th,.bal-net small,.hero small,.hero-row,.sec-meta,.calc-lines,.status,.conv,.suffix em,.foot,.img-hint,details summary,#toast,.input,.empty-act{
  font-family:var(--font-display);font-weight:500;font-variation-settings:"opsz" 12;letter-spacing:0}
/* figures: condensed, lining, tabular */
.fig,.exp-amt,.pamt,.tr-amt,.bal .num,.day .num,.stepper input,.input.big{
  font-family:var(--font-display);font-weight:800;font-variation-settings:"wdth" 80,"opsz" 24;font-variant-numeric:lining-nums tabular-nums;letter-spacing:0;color:var(--color-ink)}

/* header */
#top{position:sticky;top:0;z-index:var(--z-sticky-nav);background:var(--color-paper);padding-top:env(safe-area-inset-top);border-bottom:var(--rule-hair) solid var(--color-rule)}
.hdr{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-2xs) var(--space-md);min-height:calc(56px * var(--u))}
.ledger-btn,.brand{display:flex;align-items:center;gap:var(--space-xs);min-width:0;font-family:var(--font-display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 48;letter-spacing:var(--tracking-display);font-size:var(--text-xl);color:var(--color-ink);line-height:1.1}
.ledger-btn{flex:0 1 auto;max-width:100%;min-height:calc(44px * var(--u));padding:0;border:0;background:none;text-align:left}
.ledger-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ledger-btn svg{flex:none;transition:transform var(--dur-short) var(--ease-out)}
@media (hover:hover){.ledger-btn:hover span{text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--color-accent);text-underline-offset:.18em}}
.sync{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:var(--space-xs);min-height:calc(32px * var(--u));padding:0 var(--space-sm);border:var(--rule-hair) solid currentColor;background:none;color:var(--color-muted);font-size:var(--text-xs);white-space:nowrap;position:relative}
.sync::after{content:"";position:absolute;inset:-6px 0}
.sync i{width:8px;height:8px;background:currentColor;display:block}
.sync.live{color:var(--color-accent)}
.sync.connecting,.sync.offline{color:var(--color-warn)}
.sync.error,.sync.missing{color:var(--color-neg)}
.banner{max-width:560px;margin:0 auto;padding:0 var(--space-md) var(--space-sm)}
.banner>div{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs);padding:var(--space-sm);background:var(--color-paper-2);border-top:var(--rule-hair) solid var(--color-rule-2);font-size:var(--text-sm);color:var(--color-ink)}
.banner p{flex:1 1 180px}

/* a section opens under the heavy rule; nothing is boxed */
.card{margin:var(--space-xl) 0 0;padding-top:var(--space-sm);border-top:var(--rule-heavy) solid var(--color-line-strong)}
.card>h2{margin-bottom:var(--space-sm)}
.wrap>.card:first-child:not(.hero){margin-top:var(--space-lg)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-sm);margin-bottom:var(--space-sm)}
.sec-meta{font-size:var(--text-sm);color:var(--color-muted)}
h2 small{font-family:var(--font-display);font-weight:500;font-variation-settings:"opsz" 12;letter-spacing:0;font-size:var(--text-sm);color:var(--color-muted);margin-left:var(--space-xs)}

/* the signature: the ledger total reversed out of the ink band */
.card.hero{margin:0 calc(var(--space-md) * -1);padding:var(--space-lg) var(--space-md) var(--space-md);border-top:var(--rule-heavy) solid var(--color-line-strong);background:var(--color-band);color:var(--color-band-ink);display:grid;gap:var(--space-md)}
.hero small{display:block;font-size:var(--text-sm);color:var(--color-band-muted)}
.hero-main b{display:block;font-family:var(--font-display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;letter-spacing:var(--tracking-display);font-size:var(--text-figure);line-height:.95;color:var(--color-band-ink);font-variant-numeric:lining-nums tabular-nums;overflow-wrap:break-word;min-width:0}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-md);padding-top:var(--space-sm);border-top:var(--rule-hair) solid var(--color-band-rule);font-size:var(--text-sm);color:var(--color-band-muted)}
.hero-me{text-align:right}
.hero-me b{display:block;font-family:var(--font-display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 48;font-size:var(--text-2xl);line-height:1;color:var(--color-band-ink);font-variant-numeric:lining-nums tabular-nums}
.hero .pos{color:var(--color-band-pos)} .hero .neg{color:var(--color-band-ink)}

.warnbox{border-top-color:var(--color-warn);color:var(--color-warn);font-size:var(--text-sm)}
.warnbox ul{margin:var(--space-2xs) 0 0;padding-left:var(--space-lg);color:var(--color-ink-2)}
.empty{padding-bottom:var(--space-md);font-size:var(--text-lg);line-height:1.45;color:var(--color-ink)}
.empty .ico{width:28px;height:28px;margin:var(--space-xs) 0 var(--space-sm)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-xs);min-height:calc(48px * var(--u));padding:0 var(--space-lg);border:var(--rule-hair) solid var(--color-line-strong);background:none;color:var(--color-ink);font-size:var(--text-md);text-decoration:none;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary,.btn.dark{background:var(--color-solid);border-color:var(--color-solid);color:var(--color-solid-ink)}
.btn.line{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink)}
.btn.danger{color:var(--color-neg);border-color:var(--color-neg)}
.btn.danger-fill{background:var(--color-neg);border-color:var(--color-neg);color:var(--color-paper)}
.btn.ghost{border-color:transparent;text-decoration:underline;text-decoration-color:var(--color-rule-2);text-underline-offset:.25em}
.btn.block{display:flex;width:100%}
.btn.lg{min-height:calc(52px * var(--u));font-size:var(--text-lg)}
.btn.sm{min-height:calc(36px * var(--u));padding:0 var(--space-sm);font-size:var(--text-sm);position:relative}
.btn.sm::after{content:"";position:absolute;inset:-4px 0}
.btn-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-xs);margin-top:var(--space-sm)}
.btn-col{display:grid;gap:var(--space-xs);margin-top:var(--space-sm)}
.btn-col.flush,.btn-grid.flush{margin-top:0}
.link-btn{border:0;background:none;color:var(--color-ink);font-size:var(--text-md);padding:0 var(--space-2xs);min-width:calc(44px * var(--u));min-height:calc(44px * var(--u));text-decoration:underline;text-decoration-color:var(--color-rule-2);text-underline-offset:.25em}
.icon-btn{flex:none;width:calc(40px * var(--u));height:calc(40px * var(--u));border:var(--rule-hair) solid var(--color-rule-2);background:none;font-size:var(--text-sm);display:grid;place-items:center;color:var(--color-ink);position:relative}
.icon-btn::after{content:"";position:absolute;inset:-2px}
.icon-btn.on{background:var(--color-solid);color:var(--color-solid-ink);border-color:var(--color-solid)}
.icon-btn.danger{color:var(--color-ink)}
@media (hover:hover){.icon-btn.danger:hover:not(:disabled){color:var(--color-neg);border-color:var(--color-neg)}}
.icon-btn .ico{width:16px;height:16px}
@media (hover:hover){
  .btn:hover:not(:disabled){background:var(--color-paper-2)}
  .btn.primary:hover:not(:disabled),.btn.dark:hover:not(:disabled){background:color-mix(in oklab,var(--color-solid) 86%,var(--color-paper))}
  .btn.line:hover:not(:disabled){background:color-mix(in oklab,var(--color-accent) 86%,var(--color-ink))}
  .btn.danger-fill:hover:not(:disabled){background:color-mix(in oklab,var(--color-neg) 86%,var(--color-ink))}
  .btn.ghost:hover:not(:disabled){background:none;text-decoration-color:var(--color-accent)}
  .link-btn:hover,.inline-link:hover,details summary:hover{text-decoration-color:var(--color-accent)}
  .icon-btn:hover:not(:disabled):not(.on),.chip-btn:hover:not(.on):not(:disabled),.seg button:hover:not(.on){background:var(--color-paper-2)}
  .exp:hover .exp-title,.lrow:hover:not(.on) b{text-decoration:underline;text-decoration-color:var(--color-accent);text-underline-offset:.2em}
  .tr:hover:not(:disabled):not(.done) .check,.prow:hover:not(.on) .check{background:var(--color-paper-2)}
}

/* add button and tabs */
#fab{position:fixed;z-index:var(--z-sticky);right:max(var(--space-md),calc(50% - 264px));bottom:calc(64px * var(--u) + 16px + env(safe-area-inset-bottom));height:calc(56px * var(--u));padding:0 var(--space-lg) 0 var(--space-md);border:0;background:var(--color-solid);color:var(--color-solid-ink);font-size:var(--text-lg);display:flex;align-items:center;gap:var(--space-xs)}
#fab svg{width:20px;height:20px}
#fab:active{transform:translateY(1px)}
@media (hover:hover){#fab:hover{background:color-mix(in oklab,var(--color-solid) 86%,var(--color-paper))}}
#tabs{position:fixed;z-index:var(--z-sticky);left:0;right:0;bottom:0;background:var(--color-paper);border-top:var(--rule-hair) solid var(--color-line-strong);padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
#tabs button{height:calc(64px * var(--u));border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2xs);font-size:var(--text-xs);color:var(--color-muted);position:relative}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--color-ink)}
#tabs button.on::before{content:"";position:absolute;left:var(--space-md);right:var(--space-md);top:-1px;height:var(--rule-heavy);background:var(--color-solid)}
@media (hover:hover){#tabs button:hover:not(.on){color:var(--color-ink)}}

/* forms */
.field{display:block;margin:0 0 var(--space-md)}
.field.top{margin-top:var(--space-sm)}
.field.flush{margin:0}
.field>span{display:block;font-size:var(--text-sm);color:var(--color-muted);margin-bottom:var(--space-2xs)}
.input{width:100%;height:calc(48px * var(--u));border:var(--rule-hair) solid var(--color-muted);border-radius:0;padding:0 var(--space-sm);background:var(--color-paper);color:var(--color-ink);-webkit-appearance:none;appearance:none;outline:2px solid transparent;outline-offset:-3px}
.input:focus-visible{outline:2px solid var(--color-focus);outline-offset:-3px;border-color:var(--color-ink)}
@media (hover:hover){.input:hover:not(:disabled):not([readonly]){background-color:var(--color-paper-2)}}
.input:disabled{opacity:.55;cursor:not-allowed;background-color:var(--color-paper-2)}
.input.bad{border-color:var(--color-neg)}
select.input{background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:var(--space-xl)}
input[type=date].input{display:flex;align-items:center;min-width:0}
.input.big{font-size:var(--text-2xl);font-variation-settings:"wdth" 75,"opsz" 48;height:calc(56px * var(--u))}
.input.sm{height:calc(40px * var(--u))}
.amt-row{display:flex;gap:var(--space-sm)}
.amt-row .grow{flex:1;min-width:0}
.amt-row .cur{width:calc(110px * var(--u));flex:none}
.amt-row .cur .input{height:calc(56px * var(--u))}
.conv{margin:calc(var(--space-xs) * -1) 0 var(--space-md);font-size:var(--text-sm);color:var(--color-ink)}
.conv .hint{margin-top:var(--space-2xs)}
.warn-txt{color:var(--color-warn)}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-xs)}
.chips.join{margin-bottom:var(--space-md)}
.chip-btn{min-height:calc(40px * var(--u));padding:0 var(--space-md);border:var(--rule-hair) solid var(--color-rule-2);background:none;color:var(--color-ink);font-size:var(--text-md);position:relative}
.chip-btn::after{content:"";position:absolute;inset:-2px 0}
.chip-btn.on{background:var(--color-solid);color:var(--color-solid-ink);border-color:var(--color-solid)}
.chips.sm{gap:var(--space-2xs)}
.chips.sm .chip-btn{min-height:calc(36px * var(--u));padding:0 var(--space-sm);font-size:var(--text-sm)}
.chips.sm .chip-btn::after{inset:-4px 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:var(--rule-hair) solid var(--color-line-strong)}
.seg button{min-height:calc(44px * var(--u));border:0;border-left:var(--rule-hair) solid var(--color-line-strong);background:none;font-size:var(--text-sm);color:var(--color-ink);padding:0 var(--space-xs)}
.seg button:first-child{border-left:0}

/* split panel */
.split-tools{display:flex;align-items:center;gap:var(--space-xs);padding-bottom:var(--space-xs);border-bottom:var(--rule-hair) solid var(--color-line-strong);flex-wrap:wrap;font-size:var(--text-sm);color:var(--color-muted)}

.prow{display:flex;align-items:center;gap:var(--space-sm);width:100%;min-height:calc(52px * var(--u));padding:var(--space-xs) 0;border:0;border-bottom:var(--rule-hair) solid var(--color-rule);background:none;color:var(--color-ink);text-align:left}
.check{width:22px;height:22px;border:var(--rule-hair) solid var(--color-line-strong);flex:none;display:grid;place-items:center}

.prow.on .check::after,.tr.done .check::after{content:"";width:11px;height:6px;border:2px solid var(--color-solid-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pamt.none{font-weight:500;color:var(--color-muted)}
.stepper{display:flex;align-items:center;border:var(--rule-hair) solid var(--color-line-strong);flex:none}

.stepper input{width:calc(54px * var(--u));height:calc(40px * var(--u));border:0;border-left:var(--rule-hair) solid var(--color-rule);border-right:var(--rule-hair) solid var(--color-rule);text-align:center;background:none;padding:0;outline:2px solid transparent;outline-offset:-3px}
.stepper :focus-visible{outline:2px solid var(--color-focus);outline-offset:-3px}
.item-in{width:calc(112px * var(--u));height:calc(40px * var(--u));text-align:right;flex:none;font-variant-numeric:lining-nums tabular-nums}
.shared-box{margin:var(--space-lg) 0 0;padding-top:var(--space-sm);border-top:var(--rule-hair) solid var(--color-line-strong)}
.shared-head{margin-bottom:var(--space-xs)}
.shared-head b{display:block;font-family:var(--font-display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 48;letter-spacing:var(--tracking-display);font-size:var(--text-lg);color:var(--color-ink)}
.shared-head span{font-size:var(--text-sm);color:var(--color-muted)}
.shared-item{padding:var(--space-sm) 0;border-bottom:var(--rule-hair) solid var(--color-rule)}
.shared-row{display:flex;gap:var(--space-xs);align-items:center;margin-bottom:var(--space-xs)}
.shared-row .input:first-child{flex:1;min-width:0}
.shared-per{font-size:var(--text-sm);color:var(--color-muted);margin-top:var(--space-xs)}
.shared-box>.btn{margin-top:var(--space-sm)}
.splitin{display:flex;align-items:center;justify-content:space-between;gap:var(--space-sm);margin-top:var(--space-sm);flex-wrap:wrap}
.splitin>span{font-size:var(--text-sm);color:var(--color-muted)}
.splitin .seg{flex:1;min-width:220px}
.calc{margin-top:var(--space-lg);padding:var(--space-md);background:var(--color-paper-2);border-top:var(--rule-hair) solid var(--color-rule-2)}
.calc h3{margin-bottom:var(--space-sm)}
.calc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-sm);margin-bottom:var(--space-sm)}
.calc-grid label span{display:block;font-size:var(--text-sm);color:var(--color-muted);margin-bottom:var(--space-2xs)}
.suffix{position:relative}
.suffix .input{padding-right:var(--space-xl);height:calc(44px * var(--u))}
.suffix em{position:absolute;right:var(--space-sm);top:50%;transform:translateY(-50%);font-style:normal;color:var(--color-muted);font-size:var(--text-sm)}
.calc-lines{font-size:var(--text-sm);color:var(--color-ink-2);font-variant-numeric:lining-nums tabular-nums}
.calc-lines div{display:flex;justify-content:space-between;padding:var(--space-2xs) 0}
.calc-lines .tot{border-top:var(--rule-hair) solid var(--color-line-strong);margin-top:var(--space-2xs);padding-top:var(--space-xs);color:var(--color-ink);font-weight:800}
.status{margin-top:var(--space-sm);padding-top:var(--space-xs);border-top:var(--rule-hair) solid currentColor;font-size:var(--text-sm);font-variant-numeric:lining-nums tabular-nums}
.status.ok{color:var(--color-accent)}
.status.bad{color:var(--color-warn)}
.status .btn{margin-top:var(--space-xs)}

/* expense list */
.day{display:flex;justify-content:space-between;align-items:baseline;margin:var(--space-lg) 0 0;padding-bottom:var(--space-xs);border-bottom:var(--rule-hair) solid var(--color-line-strong);font-size:var(--text-sm);color:var(--color-ink)}
.day .num{font-size:var(--text-md)}
.exp{display:flex;gap:var(--space-sm);align-items:center;width:100%;padding:var(--space-sm) 0;border:0;border-bottom:var(--rule-hair) solid var(--color-rule);background:none;text-align:left;color:var(--color-ink)}
.exp:last-child{border-bottom:0}
.exp:active{background:var(--color-paper-2)}
.avatar{flex:none;width:calc(40px * var(--u));height:calc(40px * var(--u));display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:var(--text-md);color:var(--color-ink);background:var(--tint,var(--color-paper-3))}
.avatar.sm{width:calc(32px * var(--u));height:calc(32px * var(--u));font-size:var(--text-sm)}
.exp-main{flex:1;min-width:0}
.exp-title{color:var(--color-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-sub{font-size:var(--text-sm);color:var(--color-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-amt{text-align:right;white-space:nowrap;font-size:var(--text-lg)}
.exp-amt small{display:block;font-weight:500;font-variation-settings:"opsz" 12;font-size:var(--text-xs);color:var(--color-muted)}

/* settlement: balances as a ruled table */
.bal-th,.bal{display:grid;grid-template-columns:minmax(0,1fr) 4.25rem 4.25rem 6.5rem;gap:var(--space-xs)}
.bal-th{font-size:var(--text-xs);color:var(--color-muted);padding-bottom:var(--space-2xs);border-bottom:var(--rule-hair) solid var(--color-rule-2)}
.bal-th span:not(:first-child),.bal>span:not(:first-child){text-align:right}
.bal{align-items:baseline;padding:var(--space-sm) 0;border-bottom:var(--rule-hair) solid var(--color-rule)}
.bal-name{display:flex;align-items:center;gap:var(--space-2xs);min-width:0;color:var(--color-ink)}
.bal-name b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bal .num{font-size:var(--text-md);font-weight:500;font-variation-settings:"wdth" 80,"opsz" 12;color:var(--color-ink-2)}
.bal .bal-net{font-weight:800;color:var(--color-ink)}
.bal .bal-net.pos{color:var(--color-accent)}
.bal-net small{font-size:var(--text-xs);color:var(--color-muted);margin-right:var(--space-2xs)}
.me{font-size:var(--text-xs);padding:0 var(--space-2xs);background:var(--color-accent);color:var(--color-accent-ink);flex:none}
.tr{display:flex;align-items:center;gap:var(--space-sm);width:100%;padding:var(--space-sm) 0;border:0;border-bottom:var(--rule-hair) solid var(--color-rule);background:none;text-align:left;color:var(--color-ink)}
.tr-who{flex:1;min-width:0}
.tr-who>span:not([class]){color:var(--color-muted);margin:0 var(--space-2xs)}
.tr-amt{font-size:var(--text-xl);white-space:nowrap}
.tr.done{color:var(--color-muted)}
.tr.done .check{background:var(--color-accent);border-color:var(--color-accent)}
.tr.done .check::after{border-color:var(--color-accent-ink)}
.tr.done .tr-amt{text-decoration:line-through;text-decoration-thickness:2px;color:var(--color-muted)}
.tr.mine .tr-who{text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--color-accent);text-underline-offset:.3em}
.tr.changed .check{border-color:var(--color-warn)}
.tr:disabled{opacity:1;cursor:not-allowed;background:none;color:var(--color-ink-2)}
.done-tag{display:block;font-size:var(--text-xs);color:var(--color-accent)}
.chg-tag{display:block;font-size:var(--text-xs);color:var(--color-warn);line-height:1.4;margin-top:var(--space-3xs)}
.allclear{padding:var(--space-md) 0;font-size:var(--text-lg);color:var(--color-ink)}
.receipt-img{display:block;width:100%;max-width:420px;margin:var(--space-sm) 0 0;-webkit-touch-callout:default;user-select:auto;outline:1px solid color-mix(in oklab,var(--color-ink) 8%,transparent);outline-offset:-1px}
.img-hint{font-size:var(--text-sm);color:var(--color-muted);margin:var(--space-xs) 0 0}
pre.report{white-space:pre-wrap;word-break:break-word;font-family:var(--font-body);font-size:var(--text-sm);line-height:1.6;background:var(--color-paper-2);border-top:var(--rule-hair) solid var(--color-rule-2);padding:var(--space-sm);margin:var(--space-sm) 0 0;max-height:320px;overflow:auto;color:var(--color-ink)}
details summary{cursor:pointer;font-size:var(--text-sm);color:var(--color-ink);margin-top:var(--space-sm);padding:var(--space-sm) 0;text-decoration:underline;text-decoration-color:var(--color-rule-2);text-underline-offset:.25em}
.link-box{display:flex;gap:var(--space-xs);margin-top:var(--space-sm)}
.link-box .input{font-size:var(--text-sm);color:var(--color-muted);min-width:0}

/* settings */
.mrow{display:flex;align-items:center;gap:var(--space-xs);padding:var(--space-xs) 0;border-bottom:var(--rule-hair) solid var(--color-rule)}
.mrow .input{flex:1;min-width:0}
.addrow{display:flex;gap:var(--space-xs);margin-top:var(--space-sm)}
.addrow .input{flex:1;min-width:0}
.currow{display:flex;align-items:center;gap:var(--space-xs);padding:var(--space-xs) 0;border-bottom:var(--rule-hair) solid var(--color-rule);flex-wrap:wrap}
.currow b{min-width:calc(40px * var(--u));font-family:var(--font-display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 48;font-size:var(--text-lg);color:var(--color-ink)}
.currow .muted{font-size:var(--text-sm)}
.currow .eq{display:flex;align-items:center;gap:var(--space-xs);margin-left:auto;font-family:var(--font-display);font-weight:500;font-size:var(--text-sm);color:var(--color-muted)}
.currow .rate{width:calc(110px * var(--u));text-align:right}
.profile-grid{display:grid;grid-template-columns:calc(110px * var(--u)) minmax(0,1fr);gap:var(--space-sm);margin:var(--space-sm) 0}
.foot{font-size:var(--text-xs);color:var(--color-muted);margin:var(--space-xl) 0 0;padding-top:var(--space-sm);border-top:var(--rule-hair) solid var(--color-rule)}
.lrow{display:flex;align-items:center;gap:var(--space-sm);width:100%;padding:var(--space-sm) var(--space-xs);border:0;border-bottom:var(--rule-hair) solid var(--color-rule);background:none;text-align:left;color:var(--color-ink)}
.lrow.on{background:var(--color-paper-2)}
.lrow div{flex:1;min-width:0}
.lrow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 48;letter-spacing:var(--tracking-display);font-size:var(--text-lg)}
.lrow small{color:var(--color-muted);font-size:var(--text-sm)}
.tag{font-size:var(--text-xs);padding:var(--space-3xs) var(--space-xs);background:var(--color-accent);color:var(--color-accent-ink);white-space:nowrap}
.empty-list{color:var(--color-muted);padding:var(--space-md) var(--space-xs)}

/* welcome */
.welcome{margin-top:var(--space-lg)}
.welcome h1{font-size:var(--text-figure);line-height:1;padding-top:var(--space-xs)}
.welcome .lead{font-size:var(--text-lg);line-height:1.45;color:var(--color-ink);margin:var(--space-sm) 0 var(--space-lg);max-width:24em;text-wrap:balance;word-break:keep-all}
.feat{margin:0 0 var(--space-lg);border-top:var(--rule-hair) solid var(--color-line-strong)}
.feat div{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr);gap:var(--space-sm);padding:var(--space-sm) 0;border-bottom:var(--rule-hair) solid var(--color-rule);align-items:baseline}
.feat dt{font-family:var(--font-display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 48;letter-spacing:var(--tracking-display);font-size:var(--text-lg);line-height:1.2;color:var(--color-ink)}
.feat dd{margin:0;font-size:var(--text-sm);color:var(--color-ink-2)}

/* sheet & dialog */
#sheet-root,#dialog-root{position:fixed;inset:0;z-index:var(--z-modal)}
#dialog-root{z-index:calc(var(--z-modal) + 10);display:flex;align-items:center;justify-content:center;padding:var(--space-lg)}
.backdrop{position:absolute;inset:0;background:var(--scrim);animation:fade var(--dur-short) var(--ease-out)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:calc(100% - 56px * var(--u) - 1px - env(safe-area-inset-top));background:var(--color-paper);border-top:var(--rule-heavy) solid var(--color-line-strong);display:flex;flex-direction:column;animation:up var(--dur-short) var(--ease-out);overflow:hidden}
.sheet.tall{height:calc(100% - 56px * var(--u) - 1px - env(safe-area-inset-top))}
/* 帳本下拉選單：從標題按鈕下方展開 */
.sheet.drop{top:var(--drop-top,72px);bottom:auto;width:calc(100% - var(--space-lg));max-width:536px;max-height:calc(100% - var(--drop-top,72px) - var(--space-md));border:var(--rule-hair) solid var(--color-line-strong);border-top:var(--rule-heavy) solid var(--color-line-strong);animation:drop var(--dur-short) var(--ease-out);transform-origin:top left}
.sheet.drop .sheet-body{padding:var(--space-xs) var(--space-sm)}
.sheet.drop .sheet-foot{padding:var(--space-sm)}
.drop-title{font-size:var(--text-sm);color:var(--color-muted);padding:var(--space-2xs) var(--space-xs) var(--space-xs)}
#sheet-root.is-drop .backdrop{background:var(--scrim-soft)}
body.drop-open #top{z-index:calc(var(--z-modal) + 5)}
body.drop-open .ledger-btn svg{transform:rotate(180deg)}
/* 關閉動畫：從哪裡出來就往哪裡收回 */
#sheet-root.closing .backdrop{opacity:0;transition:opacity calc(var(--dur-micro) * 1.5) var(--ease-in)}
#sheet-root.closing .sheet{animation:none;transform:translateY(100%);transition:transform calc(var(--dur-micro) * 1.5) var(--ease-in)}
#sheet-root.closing .sheet.drop{transform:translateY(-8px);opacity:0;transition:transform var(--dur-micro) var(--ease-in),opacity var(--dur-micro) var(--ease-in)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-xs);padding:var(--space-2xs) var(--space-sm);border-bottom:var(--rule-hair) solid var(--color-rule);flex:none;min-height:calc(52px * var(--u))}
.sheet-head b{font-family:var(--font-display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 48;letter-spacing:var(--tracking-display);font-size:var(--text-xl);color:var(--color-ink)}
.sheet-head .spacer{width:calc(44px * var(--u))}
.sheet-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:var(--space-md)}
.sheet-foot{flex:none;padding:var(--space-sm) var(--space-md) calc(var(--space-sm) + env(safe-area-inset-bottom));border-top:var(--rule-hair) solid var(--color-line-strong)}
.sheet-foot .btn-col{margin-top:var(--space-xs)}
.dialog{position:relative;width:100%;max-width:400px;max-height:calc(100% - var(--space-lg));overflow:auto;background:var(--color-paper);border-top:var(--rule-heavy) solid var(--color-line-strong);padding:var(--space-lg) var(--space-md) var(--space-md);animation:pop var(--dur-short) var(--ease-out)}
.dialog h3{font-size:var(--text-xl);margin-bottom:var(--space-xs)}
.dialog p{margin:0 0 var(--space-sm);color:var(--color-ink-2)}
.dialog ul{margin:0 0 var(--space-sm);padding-left:var(--space-lg)}
.dialog .input.url{font-size:var(--text-sm)}
.dlg-btns{display:flex;gap:var(--space-xs);margin-top:var(--space-md)}
.dlg-btns.tight{margin-top:var(--space-xs)}
.dlg-btns .btn{flex:1}
.dialog textarea{width:100%;min-height:200px;border:var(--rule-hair) solid var(--color-muted);border-radius:0;padding:var(--space-xs);background:var(--color-paper-2);color:var(--color-ink)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
#toast{position:fixed;z-index:var(--z-toast);left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--color-solid);color:var(--color-solid-ink);padding:var(--space-sm) var(--space-md);font-size:var(--text-sm);opacity:0;pointer-events:none;transition:opacity var(--dur-short) var(--ease-out),transform var(--dur-short) var(--ease-out);max-width:calc(100% - var(--space-xl));text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* 字體大小：緊密＝原始尺寸；適中、寬鬆放大文字、間距與按鈕，方便長輩閱讀與點按 */
html[data-density="comfy"]{font-size:112.5%;--u:1.12;
  --space-3xs:2px;--space-2xs:5px;--space-xs:10px;--space-sm:14px;--space-md:19px;--space-lg:28px;--space-xl:46px;--space-2xl:72px;--space-3xl:108px;--space-4xl:168px}
html[data-density="roomy"]{font-size:125%;--u:1.25;
  --space-3xs:3px;--space-2xs:6px;--space-xs:12px;--space-sm:17px;--space-md:22px;--space-lg:32px;--space-xl:52px;--space-2xl:80px;--space-3xl:120px;--space-4xl:190px}
html[data-density="roomy"] body{line-height:1.65}
html:not([data-density="compact"]) .bal-th{display:none}
html:not([data-density="compact"]) .bal{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name net" "paid owed";column-gap:var(--space-md);row-gap:var(--space-3xs)}
html:not([data-density="compact"]) .bal>span:not(:first-child){white-space:nowrap}
html:not([data-density="compact"]) .bal>span:nth-child(3){text-align:right}
html:not([data-density="compact"]) .splitin{flex-direction:column;align-items:stretch}
html:not([data-density="compact"]) .splitin .seg{min-width:0}
.splitin .seg button{white-space:nowrap}
html:not([data-density="compact"]) .bal>span:nth-child(1){grid-area:name}
html:not([data-density="compact"]) .bal>span:nth-child(2){grid-area:paid;text-align:left}
html:not([data-density="compact"]) .bal>span:nth-child(3){grid-area:owed}
html:not([data-density="compact"]) .bal>span:nth-child(4){grid-area:net}
html:not([data-density="compact"]) .bal>span:nth-child(2)::before{content:"墊付 ";color:var(--color-muted);font-size:var(--text-sm)}
html:not([data-density="compact"]) .bal>span:nth-child(3)::before{content:"應付 ";color:var(--color-muted);font-size:var(--text-sm)}
.density-seg{margin-top:var(--space-sm)}
.density-preview{margin-top:var(--space-sm);color:var(--color-ink-2)}
.welcome .density-row{margin-top:var(--space-lg);padding-top:var(--space-sm);border-top:var(--rule-hair) solid var(--color-rule)}
.welcome .density-row>span{display:block;font-family:var(--font-display);font-size:var(--text-sm);color:var(--color-muted);margin-bottom:var(--space-2xs)}
</style>
</head>

</button>

<nav id="tabs" hidden>
  <div class="in">
    <button type="button" data-act="tab" data-tab="expenses">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>消費明細
    </button>

    payer: ex?.payer && all.includes(ex.payer) ? ex.payer : (L.me && all.includes(L.me) ? L.me : all[0]),
    date: ex?.date || today(), mode: ex?.mode || 'equal',

      <div class="field"><span>誰先付錢</span><div class="chips">${L.members.map(m => `<button type="button" class="chip-btn${m.id === ed.payer ? ' on' : ''}" data-payer="${m.id}">${esc(m.name)}</button>`).join('')}</div></div>

function expDoc(e, L) {

}
function remote(L, op) {

}
function setSync(status, msg = '') { ui.sync = { status, msg }; renderHeader(cur()); }

async function deleteRoom(L) {

  if (!await ask({ title: '刪除雲端房間？', msg: '房間裡的所有雲端資料會被永久刪除，其他人也無法再同步或加入。<br><br>每個人手機上已經同步的帳本會保留下來，結算結果不會消失。', ok: '刪除房間', danger: true })) return;
  toast('刪除中…');

  const ref = f.doc(f.db, 'rooms', L.room.id);
  disconnectRoom(); renderHeader(L);
  try {
    // 先標記關閉，讓其他人停止同步並保留本機副本，再刪資料
    try { await f.updateDoc(ref, { closed: true, updatedAt: Date.now() }); }
    catch (e) { if (e.code !== 'not-found') throw e; }
    await new Promise(r => setTimeout(r, 1500));
    const [ms, es] = await Promise.all([f.getDocs(f.collection(ref, 'members')), f.getDocs(f.collection(ref, 'expenses'))]);
    const refs = [...ms.docs, ...es.docs].map(d => d.ref);
    for (let i = 0; i < refs.length; i += 400) { const b = f.writeBatch(f.db); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); }
    await f.deleteDoc(ref);
  } catch (e) {
    console.error(e); connectRoom(L);
    toast('刪除失敗：' + (e.code === 'permission-denied' ? '請先更新 Firestore 安全規則（見 README）' : (e.code || e.message)));
    return;
  }

  id = String(id || '').toLowerCase();
  if (!/^[a-z0-9]{12,40}$/.test(id)) { toast('房間連結格式不正確'); return; }
  if (!FIREBASE_CONFIG) { await ask({ title: '無法加入房間', msg: '這個網頁還沒有設定 Firebase，所以沒辦法使用多人房間。請聯絡分享連結的人。', cancel: null, ok: '知道了' }); return; }
  ui.shared = null;
  let L = Object.values(store.ledgers).find(l => l.room?.id === id);
  if (!L) { L = newLedger('載入中…'); L.room = { id }; addLedger(L); }
  store.currentId = L.id; saveStore(); ui.tab = 'expenses';
  render(); connectRoom(L);
}
function openJoin(L) {
  if (!$('#dialog-root').hidden || sheetOpen()) return;
  openDialog(`<h3>加入「${esc(L.name)}」</h3><p>${L.members.length ? '你是哪一位？選擇你的名字，或輸入新名字加入。' : '輸入你的名字加入這個房間。'}</p>
    ${L.members.length ? `<div class="chips join">${L.members.map(m => `<button type="button" class="chip-btn" data-join="${m.id}">${esc(m.name)}</button>`).join('')}</div>` : ''}
    <div class="addrow"><input class="input" id="join-name" placeholder="你的名字" maxlength="20" enterkeyhint="done" autocomplete="off"><button type="button" class="btn primary" data-joinnew>加入</button></div>
    <div class="dlg-btns"><button type="button" class="btn ghost" data-act="dialog-cancel">先看看就好</button></div>`, el => {
    const addNew = () => {
      const name = $('#join-name', el).value.trim(); if (!name) { toast('請輸入名字'); return; }
      const ex = L.members.find(m => m.name === name);
      if (ex) L.me = ex.id;
      else { const m = { id: uid(), name: name.slice(0, 20), createdAt: Date.now() }; mutate(L, L => { L.members.push(m); }, (f, ref) => f.setDoc(f.doc(ref, 'members', m.id), memberDoc(L, m))); L.me = m.id; }
      touch(L); closeDialog(); toast(`歡迎，${name}！`);
    };
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.join) { L.me = b.dataset.join; touch(L); closeDialog(); toast(`嗨，${memberName(L, L.me)}！`); }
      else if ('joinnew' in b.dataset) addNew();
    });
    $('#join-name', el).addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addNew(); } });
  });
}

/* ---------------- 事件 ---------------- */
const ACT = {
  'tab': b => { ui.tab = b.dataset.tab; render(); window.scrollTo(0, 0); },
  'density': b => {
    const d = b.dataset.d; document.documentElement.dataset.density = d;
    try { localStorage.setItem('splitbill.density', d); } catch (e) { }
    ui.receipt = null; render(); toast(`字體大小：${DENSITY.find(x => x[0] === d)[1]}`);
  },
  'add-exp': () => openExpense(null),
  'edit-exp': b => readonly() ? toast('這是唯讀的分享帳本，存成自己的帳本後即可編輯') : openExpense(b.dataset.id),
  'sheet-close': () => closeSheet(),
  'dialog-cancel': () => { const c = dialogCancel; closeDialog(); c?.(); },
  'go-members': () => goMembers(),
  'go-profile': () => { ui.tab = 'settings'; render(); setTimeout(() => $('[data-k="bankCode"]')?.scrollIntoView({ block: 'center' }), 60); },
  'sync-info': () => toast(ui.sync.msg || { live: '已連線，所有人的修改會即時同步', connecting: '正在連線到房間…' }[ui.sync.status] || '同步狀態'),
  'ledgers': b => {
    if (sheetOpen() && document.body.classList.contains('drop-open')) return closeSheet(); // 再按一次標題就收合
    const L = cur();
    openSheet(`<div class="sheet-body"><div class="drop-title">我的帳本</div>${store.order.map(id => {
        const l = store.ledgers[id], st = computeLedger(l);
        return `<button type="button" class="lrow${l === L ? ' on' : ''}" data-act="switch" data-id="${id}"><div><b>${esc(l.name)}</b><small>${l.members.length} 人、${l.expenses.length} 筆，共 ${money(st.total, l.mainCurrency, l.rounding)}</small></div>${l.room ? '<span class="tag">房間</span>' : ''}</button>`;
      }).join('') || '<p class="empty-list">還沒有帳本</p>'}
      ${ui.shared ? `<p class="hint">目前正在檢視分享的帳本，切換後會關閉檢視。</p>` : ''}</div>
      <div class="sheet-foot"><div class="btn-grid flush"><button type="button" class="btn primary" data-act="new-ledger">＋ 新帳本</button><button type="button" class="btn" data-act="sample">載入範例</button></div>${FIREBASE_CONFIG ? '<div class="btn-col"><button type="button" class="btn" data-act="join-room">加入房間（貼上邀請連結）</button></div>' : ''}</div>`, { anchor: b });
  },
  'switch': b => { closeSheet(); ui.tab = 'expenses'; switchLedger(b.dataset.id); },
  'new-ledger': async () => {
    closeSheet();
    const name = await askText({ title: '新帳本名稱', placeholder: '例如：東京五日遊、週五聚餐', ok: '建立' });
    if (name === null) return;
    ui.shared = null; clearHash();
    const L = newLedger(name || '新帳本'); addLedger(L); disconnectRoom();
    ui.tab = 'settings'; render(); toast('先新增一起分帳的成員吧'); goMembers();
  },
  'sample': () => { closeSheet(); ui.shared = null; clearHash(); const L = sampleLedger(); addLedger(L); disconnectRoom(); ui.tab = 'expenses'; render(); window.scrollTo(0, 0); toast('已載入範例帳本，到「結算與分享」看看結果'); },
  'import': () => importBackup(),
  'join-room': async () => {
    closeSheet();
    const v = await askText({ title: '加入房間', msg: '貼上朋友傳來的房間邀請連結，或直接輸入房間 ID。', placeholder: '貼上邀請連結或房間 ID', ok: '加入', maxlength: 20000 });
    if (!v) return;
    const m = v.match(/[#&?]room=([a-z0-9]{12,40})/i) || v.trim().match(/^([a-z0-9]{12,40})$/i);
    if (m) return joinRoom(m[1]);
    const d = v.match(/#d=([A-Za-z0-9_-]+)/); // 貼到的是「分享帳本連結」也能直接開啟
    if (d) { location.hash = 'd=' + d[1]; return; }
    toast('看不懂這個連結，請確認是房間邀請連結或房間 ID');
  },
  'export': () => exportBackup(),
  'del-ledger': async () => {
    const L = cur(); if (!L || readonly()) return;
    if (!await ask({ title: `刪除「${L.name}」？`, msg: L.room ? '只會刪除這台裝置上的帳本，雲端房間與其他成員的資料不受影響。要刪除雲端資料，請改用「刪除雲端房間」。' : '刪除後無法復原，建議先匯出備份。', ok: '刪除', danger: true })) return;
    disconnectRoom(); delete store.ledgers[L.id]; store.order = store.order.filter(x => x !== L.id); store.currentId = store.order[0] || null;
    saveStore(); ui.tab = 'expenses'; const n = cur(); if (n?.room) connectRoom(n); render(); toast('已刪除');
  },
  'round': b => {
    const L = cur(), mode = b.dataset.mode; if (L.rounding === mode) return;
    if (readonly()) { L.rounding = mode; render(); return; }
    mutate(L, L => { L.rounding = mode; }, metaOp(L));
  },
  'settle-toggle': b => {
    const L = cur(), key = b.dataset.key, amt = +b.dataset.amt;
    const prev = L.settled[key], done = prev != null && Math.abs(prev - amt) < 100;
    const val = done ? null : amt; // 已結清 → 取消；未結清或金額已變動 → 以目前金額標記結清
    mutate(L, L => { if (val == null) delete L.settled[key]; else L.settled[key] = val; },
      (f, ref) => f.updateDoc(ref, { [`settled.${key}`]: val == null ? f.deleteField() : val, updatedAt: Date.now() }));
    if (val != null) toast(prev != null ? '已更新為目前金額並標記結清' : '已標記為結清');
  },
  'settle-clear-stale': () => {
    const L = cur(); if (readonly()) return;
    const stale = staleSettled(L, settleView(L, computeLedger(L))); if (!stale.length) return;
    mutate(L, L => { stale.forEach(x => delete L.settled[x.key]); },
      (f, ref) => f.updateDoc(ref, Object.assign({ updatedAt: Date.now() }, ...stale.map(x => ({ [`settled.${x.key}`]: f.deleteField() })))));
    toast('已清除舊的結清紀錄');
  },
  'copy-report': () => { const L = cur(), st = computeLedger(L); copyText(buildReport(L, st, settleView(L, st)), '已複製，貼到 LINE 就好'); },
  'line-report': () => { const L = cur(), st = computeLedger(L); openLine(buildReport(L, st, settleView(L, st))); },
  'make-image': () => { const L = cur(), st = computeLedger(L); ui.receipt = null; showReceipt(L, st, settleView(L, st)); setTimeout(() => $('#img-area img')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); },
  'hide-image': () => { ui.receipt = null; $('#img-area').innerHTML = ''; },
  'share-image': () => {
    if (!ui.receipt) return;
    receiptBlob(blob => {
      const file = new File([blob], receiptName(cur()), { type: 'image/png' });
      navigator.share({ files: [file] }).catch(e => { if (e.name !== 'AbortError') toast('無法分享，請長按圖片儲存'); });
    });
  },
  'download-image': () => {
    if (!ui.receipt) return;
    const name = receiptName(cur());
    receiptBlob(blob => {
      if (!blob) return toast('圖片產生失敗，請長按圖片儲存');
      const file = window.File ? new File([blob], name, { type: 'image/png' }) : null;
      if (isIOS()) {
        // iPhone／iPad：用系統分享面板，選「儲存影像」就會存進照片
        if (file && navigator.canShare?.({ files: [file] })) {
          navigator.share({ files: [file] }).catch(e => { if (e.name !== 'AbortError') toast('請長按上方圖片，選擇「加入照片」'); });
        } else toast('請長按上方圖片，選擇「加入照片」或「儲存影像」');
        return;
      }
      downloadBlob(blob, name); toast('已下載圖片');
    });
  },
  'copy-link': () => { if (!ui.share.url || $('#share-link')?.value === '產生中…') return toast('連結產生中，請稍候'); copyText(ui.share.url, '連結已複製'); },
  'line-link': () => { if (!ui.share.url) return toast('連結產生中，請稍候'); openLine(`🧾 ${cur().name} 的分帳明細，點開就能看：\n${ui.share.url}`); },
  'share-link': () => { if (!ui.share.url) return toast('連結產生中，請稍候'); navigator.share({ title: cur().name, text: `🧾 ${cur().name} 的分帳明細`, url: ui.share.url }).catch(() => { }); },
  'save-shared': () => {
    const L = normalizeLedger({ ...ui.shared, id: uid(), updatedAt: Date.now() });
    ui.shared = null; clearHash(); addLedger(L); disconnectRoom(); ui.tab = 'expenses'; render(); toast('已存成你的帳本，可以開始編輯了');
  },
  'close-shared': () => { ui.shared = null; clearHash(); const L = cur(); if (L?.room) connectRoom(L); render(); },
  'add-member': () => {
    const i = $('#add-member-input');
    if (addMembers(cur(), i.value)) { ui.pendingRender = false; render(); $('#add-member-input')?.focus(); toast('已新增'); }
    else if (!i.value.trim()) i.focus();
  },
  'del-member': b => deleteMember(cur(), b.dataset.id),
  'set-me': b => { const L = cur(); L.me = L.me === b.dataset.id ? null : b.dataset.id; touch(L); },
  'add-cur': async () => {
    const L = cur(); let code = $('#add-cur-sel').value;
    if (code === '__other') { code = (await askText({ title: '輸入幣別代碼', msg: '請輸入 3 個英文字母的國際代碼，例如 TRY（土耳其里拉）。', placeholder: 'ABC', maxlength: 3 }) || '').toUpperCase(); if (!code) return; }
    if (!/^[A-Z]{3}$/.test(code)) return toast('幣別代碼需為 3 個英文字母');
    if (code === L.mainCurrency || L.currencies.some(c => c.code === code)) return toast('這個幣別已經存在');
    mutate(L, L => { L.currencies.push({ code, rate: '' }); }, metaOp(L));
    setTimeout(() => { const i = $(`[data-code="${code}"].rate`); i?.focus(); }, 80);
    toast(`已新增 ${code}，請填入匯率`);
  },
  'del-cur': async b => {
    const L = cur(), code = b.dataset.code, n = L.expenses.filter(e => e.currency === code).length;
    if (n) return ask({ title: `無法移除 ${code}`, msg: `還有 ${n} 筆消費使用 ${code}，請先修改那些消費的幣別。`, cancel: null, ok: '知道了' });
    mutate(L, L => { L.currencies = L.currencies.filter(c => c.code !== code); }, metaOp(L));
  },
  'room-create': () => createRoom(cur()),
  'room-copy': () => { const L = cur(); if (L?.room) copyText(roomUrl(L), '邀請連結已複製'); },
  'room-line': () => { const L = cur(); if (L?.room) openLine(`🧾 一起來記「${L.name}」的帳！點連結輸入名字就能加入：\n${roomUrl(L)}`); },
  'room-who': () => { const L = cur(); if (L?.room) openJoin(L); },
  'room-delete': () => deleteRoom(cur()),
  'room-leave': async () => {
    const L = cur();
    if (!await ask({ title: '離開房間？', msg: '這台裝置會保留目前的帳本副本，但之後不會再和其他人同步。', ok: '離開', danger: true })) return;
    disconnectRoom(); L.room = null; touch(L); toast('已離開房間');
  }
};
const CHG = {
  'ledger-name': t => { const L = cur(), v = t.value.trim() || '未命名帳本'; if (v === L.name) return; mutate(L, L => { L.name = v.slice(0, 40); }, metaOp(L)); },
  'member-name': t => {
    const L = cur(), id = t.dataset.id, v = t.value.trim().slice(0, 20), m = L.members.find(x => x.id === id);
    if (!m || v === m.name) return;
    if (!v) { t.value = m.name; return toast('名字不能空白'); }
    if (L.members.some(x => x.id !== id && x.name === v)) { t.value = m.name; return toast('已經有同名的成員'); }
    mutate(L, () => { m.name = v; }, (f, ref) => f.setDoc(f.doc(ref, 'members', id), memberDoc(L, m)));
  },
  'main-cur': async t => {
    const L = cur(), B = t.value;
    if (L.expenses.length && !await ask({ title: `把主結算幣別改成 ${B}？`, msg: L.currencies.some(c => c.code === B) ? `會依目前匯率自動換算其他幣別的匯率，並把原本的 ${L.mainCurrency} 改為外幣。` : `原本以 ${L.mainCurrency} 記錄的消費會變成外幣，需要另外填入 ${L.mainCurrency} 對 ${B} 的匯率。`, ok: '更改' })) { t.value = L.mainCurrency; return; }
    mutate(L, L => changeMainCurrency(L, B), metaOp(L));
  },
  'cur-rate': t => {
    const L = cur(), code = t.dataset.code, c = L.currencies.find(x => x.code === code); if (!c) return;
    const v = parseScaled(t.value, 6);
    if (t.value.trim() && !(v > 0n)) { toast('匯率需要是大於 0 的數字'); t.value = c.rate; return; }
    const s = v ? scaledToStr(v, 6) : '';
    if (s === c.rate) return;
    mutate(L, () => { c.rate = s; }, metaOp(L));
  },
  'profile': t => { store.profile[t.dataset.k] = t.value.trim(); if (t.dataset.k === 'bankAccount' && !t.value.trim()) store.profile.attach = false; saveStore(); ui.receipt = null; },
  'attach-bank': t => { store.profile.attach = t.checked; saveStore(); scheduleRender(); },
  'attach-link': t => { ui.attachLink = t.checked; scheduleRender(); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(t, e);
});
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t) CHG[t.dataset.chg]?.(t, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing && e.target.id === 'add-member-input') { e.preventDefault(); ACT['add-member'](); }
  if (e.key === 'Escape') { if (!$('#dialog-root').hidden) ACT['dialog-cancel'](); else if (sheetOpen()) closeSheet(); }
});
window.addEventListener('storage', e => { if (e.key === STORE_KEY && !ui.conn) { store = loadStore(); scheduleRender(); } }); // 多分頁同步

/* ---------------- 網址處理與啟動 ---------------- */
async function handleHash() {
  const h = location.hash.slice(1); if (!h) return;
  const p = new URLSearchParams(h);
  if (p.get('d')) {
    try { ui.shared = await decodeShare(p.get('d')); ui.tab = 'settle'; disconnectRoom(); }
    catch (e) { console.error(e); toast(e.message === 'old' ? '瀏覽器版本太舊，無法開啟這個連結' : '分享連結無法讀取，可能被截斷了'); clearHash(); }
  } else if (p.get('room')) { clearHash(); await joinRoom(p.get('room')); }
}
window.addEventListener('hashchange', async () => { await handleHash(); render(); });
(async function init() {
  if (store.currentId && !store.ledgers[store.currentId]) store.currentId = store.order[0] || null;
  if (!store.currentId && store.order.length) store.currentId = store.order[0];
  await handleHash();
  render();
  const L = cur(); if (L?.room && !ui.shared) connectRoom(L);
})();

// 測試用掛勾（不影響正常使用）
window.__splitbill = { computeExpense, receiptCanvas, settleState, migrateSettled, allocate, minTransfers, roundLR, computeLedger, settleView, encodeShare, decodeShare, sampleLedger, parseScaled, itemCalc, get store() { return store; } };
</script>
</body>
